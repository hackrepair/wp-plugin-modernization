name: Bug report
description: Report a reproducible problem in WP Plugin Modernization.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve WP Plugin Modernization. Use synthetic examples and do not attach private plugin source, credentials, customer data, or sensitive filesystem paths.

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0.dev1 or a commit SHA
    validations:
      required: true

  - type: dropdown
    id: input-type
    attributes:
      label: Input type
      options:
        - Plugin directory
        - Plugin ZIP archive
        - Installed command or packaging
        - Generated report
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide exact commands and a minimal synthetic fixture when possible.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized output or traceback text.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Python 3.13, PHP 8.3
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, personal data, customer information, proprietary source, and real sensitive paths.
          required: true
